    <!-- Top Control Bar (Mobile responsive) -->

        </div>

            <!-- Scenario Selector -->

                <button @click="currentCrop = 'negilu_tomato'" 
                        :class="currentCrop === 'negilu_tomato' ? 'bg-[#1C5A2C] text-white shadow-xs' : 'text-stone-700 hover:text-stone-950'"

                    Tomato (Benchmark)
                </button>
                <button @click="currentCrop = 'pepper'"

        <!-- ========================================================================= -->
        <!-- PROPOSED COMPACT CLASSIC DESIGN: WHAT'S NEXT (PRICE FORECAST)              -->
        <!-- 2-COLUMN ON MOBILE | 4-COLUMN ON DESKTOP | NEGILU HERO PERCENTAGE CLARITY  -->
        <!-- ========================================================================= -->
        <div class="classic-card rounded-2xl sm:rounded-3xl p-2.5 sm:p-6 shadow-sm space-y-3 sm:space-y-5 overflow-hidden">
            
            <!-- 1. SECTION HEADER (Classic High Contrast Banner) -->
            <div class="flex flex-wrap items-center justify-between gap-1.5 pb-2 sm:pb-3 border-b-2 border-[#F0EAE1]">
                <div class="flex flex-wrap items-center gap-1.5 sm:gap-3">
                    <!-- Solid Forest Green Bar -->
                    <span class="w-1.5 sm:w-2 h-4 sm:h-6 rounded-full bg-[#1C5A2C]"></span>
                    
                    <h2 class="text-base sm:text-xl font-black text-stone-950 tracking-tight" :class="lang === 'kn' ? 'kn-text' : 'font-sans'">
                        <span x-text="lang === 'en' ? 'What\'s next' : 'ಮುಂದೇನು?'"></span>
                    </h2>

                    <!-- Crop Variety & Grade Pill -->
                    <span class="inline-flex items-center gap-1 px-1.5 sm:px-2 py-0.5 rounded-full text-[9.5px] sm:text-[11px] font-black bg-[#FAF6EE] text-[#1C5A2C] border border-[#D9CEB8] shadow-2xs">
                        <span>🏷️</span>
                        <span :class="lang === 'kn' ? 'kn-text' : ''" x-text="lang === 'en' ? crops[currentCrop].nameEn : crops[currentCrop].nameKn"></span>
                    </span>

                    <!-- Subtitle (Desktop only) -->
                    <span class="text-xs font-bold text-stone-500 hidden md:inline" :class="lang === 'kn' ? 'kn-text' : ''">
                        • <span x-text="lang === 'en' ? 'Price Forecast & Movement Trends' : 'ದರ ಮುನ್ಸೂಚನೆ & ನಿರೀಕ್ಷಿತ ಶ್ರೇಣಿ'"></span>
                    </span>
                </div>

                <!-- Updated Daily Status Badge with Pulse -->
                <div class="inline-flex items-center gap-1 px-2 py-0.5 sm:px-2.5 sm:py-1 rounded-full bg-emerald-50 border border-emerald-300 text-emerald-900 text-[9.5px] sm:text-[11px] font-black shadow-2xs">
                    <span class="w-1.5 h-1.5 sm:w-2 sm:h-2 rounded-full bg-[#1C5A2C] animate-pulse"></span>
                    <span :class="lang === 'kn' ? 'kn-text' : ''" x-text="lang === 'en' ? 'Updated daily' : 'ದೈನಂದಿನ ಅಪ್ಡೇಟ್'"></span>
                </div>
            </div>

            <!-- 2. 4-CARD FORECAST HORIZON GRID (2 COLUMNS ON MOBILE, 4 ON DESKTOP) -->
            <div class="grid grid-cols-2 lg:grid-cols-4 gap-2 sm:gap-3.5">
                <template x-for="(card, index) in crops[currentCrop].forecast" :key="index">
                    <div class="classic-subcard rounded-xl sm:rounded-2xl p-2 sm:p-4 shadow-2xs transition-all duration-200 flex flex-col justify-between space-y-2 sm:space-y-3 relative overflow-hidden group">
                        
                        <!-- Top Accent Line -->
                        <div class="absolute top-0 left-0 right-0 h-1 transition-colors"
                             :class="{
                                 'bg-[#16803C]': card.direction === 'up',
                                 'bg-[#C0392B]': card.direction === 'down',
                                 'bg-amber-600': card.direction === 'steady'
                             }"></div>

                        <!-- Card Header: Horizon Title & Target Date -->
                        <div class="flex items-center justify-between gap-1 pt-0.5">
                            <span class="px-1.5 sm:px-2 py-0.5 rounded bg-[#1C5A2C] text-white text-[9px] sm:text-[11px] font-black tracking-wider uppercase font-sans shadow-2xs border border-[#1C5A2C]"
                                  x-text="lang === 'en' ? card.titleEn : card.titleKn">
                            </span>
                            
                            <span class="text-[9px] sm:text-xs font-bold text-stone-500 font-sans whitespace-nowrap"
                                  x-text="card.dateFormatted">
                            </span>
                        </div>

                        <!-- Hero Metric: Expected Movement Percentage (Negilu Style - Giant & Eye-Catching) -->
                        <div class="space-y-0.5 sm:space-y-1">
                            <div class="flex items-baseline gap-1">
                                <span class="text-xl sm:text-2xl lg:text-[32px] font-black tracking-tight font-sans leading-none"
                                      :class="{
                                          'text-[#16803C]': card.direction === 'up',
                                          'text-[#C0392B]': card.direction === 'down',
                                          'text-[#B45309]': card.direction === 'steady'
                                      }"
                                      x-text="card.heroChange">
                                </span>
                            </div>

                            <!-- Sub-line: Predicted Target Price with Direction Arrow -->
                            <div class="flex items-baseline gap-1 text-stone-900 font-sans flex-wrap leading-tight">
                                <span class="text-xs sm:text-sm lg:text-base font-black tracking-tight">
                                    ₹<span x-text="card.expectedPrice.toLocaleString('en-IN')"></span>
                                </span>
                                <span class="text-xs font-black"
                                      :class="{
                                          'text-[#16803C]': card.direction === 'up',
                                          'text-[#C0392B]': card.direction === 'down',
                                          'text-[#B45309]': card.direction === 'steady'
                                      }"
                                      x-text="card.arrow">
                                </span>
                                <span class="text-[9px] sm:text-[11px] font-semibold text-stone-400" :class="lang === 'kn' ? 'kn-text' : 'font-sans'">
                                    /<span x-text="lang === 'en' ? card.unitEn : card.unitKn"></span>
                                </span>
                            </div>
                        </div>

                        <!-- Bottom Section: Auction Range & Confidence -->
                        <div class="pt-1.5 sm:pt-2.5 border-t border-[#EAE3D2] space-y-1.5 sm:space-y-2 text-xs">
                            <!-- Expected Trading Range -->
                            <div class="text-[9.5px] sm:text-xs text-stone-600 font-sans leading-tight">
                                <span class="font-bold text-stone-400" :class="lang === 'kn' ? 'kn-text' : ''" x-text="lang === 'en' ? 'range: ' : 'ಶ್ರೇಣಿ: '"></span>
                                <span class="font-black text-stone-800 whitespace-nowrap">
                                    ₹<span x-text="card.lowerBound.toLocaleString('en-IN')"></span> – ₹<span x-text="card.upperBound.toLocaleString('en-IN')"></span>
                                </span>
                            </div>

                            <!-- Confidence Score & Progress Bar (with Qualitative Status) -->
                            <div class="space-y-1">
                                <div class="flex items-center justify-between text-[8px] sm:text-[10px] font-bold tracking-wider uppercase">
                                    <span class="text-stone-400 font-extrabold" :class="lang === 'kn' ? 'kn-text' : ''" x-text="lang === 'en' ? 'CONFIDENCE' : 'ವಿಶ್ವಾಸ'"></span>
                                    <span class="font-black font-sans"
                                          :class="{
                                              'text-[#16803C]': card.confidence >= 70,
                                              'text-[#B45309]': card.confidence >= 50 && card.confidence < 70,
                                              'text-stone-600': card.confidence < 50
                                          }">
                                        <span :class="lang === 'kn' ? 'kn-text' : ''" x-text="lang === 'en' ? card.qualitativeEn : card.qualitativeKn"></span>
                                    </span>
                                </div>
                                <div class="w-full bg-[#E5DECE] h-1.5 rounded-full overflow-hidden">
                                    <div class="h-full rounded-full transition-all duration-500" 
                                         :style="'width: ' + card.confidence + '%; background-color: ' + (card.confidence >= 70 ? '#16803C' : (card.confidence >= 50 ? '#D97706' : '#9CA3AF'))">
                                    </div>
                                </div>
                            </div>
                        </div>

                    </div>
                </template>
            </div>

            <!-- 3. ACTIONABLE "WHY" EXPLANATORY CARD (Intelligence Card with Lightbulb) -->
            <div class="rounded-xl sm:rounded-2xl p-2.5 sm:p-4 bg-[#FAF6EE] border-2 border-[#D9CEB8] text-stone-900 flex items-start gap-2 sm:gap-3.5 shadow-2xs">
                <div class="w-7 h-7 sm:w-9 sm:h-9 rounded-lg sm:rounded-xl bg-amber-100 border border-amber-300 flex items-center justify-center shrink-0 text-sm sm:text-lg shadow-2xs">
                    💡
                </div>
                <div class="space-y-0.5 text-xs sm:text-sm">
                    <div class="font-black text-stone-950 flex items-center gap-1.5 sm:gap-2" :class="lang === 'kn' ? 'kn-text' : ''">
                        <span class="text-xs sm:text-sm" x-text="lang === 'en' ? 'Market Intelligence & Analysis' : 'ಮಾರುಕಟ್ಟೆ ಒಳನೋಟ & ವಿಶ್ಲೇಷಣೆ'"></span>
                        <span class="text-[8.5px] sm:text-[9px] font-black uppercase px-1.5 py-0.5 rounded bg-[#1C5A2C] text-white">AI INSIGHT</span>
                    </div>
                    <p class="text-stone-700 leading-snug font-medium text-[10.5px] sm:text-xs" :class="lang === 'kn' ? 'kn-text' : ''">
                        <strong class="font-bold text-stone-950" x-text="lang === 'en' ? 'Why: ' : 'ಕಾರಣ: '"></strong>
                        <span x-text="lang === 'en' ? crops[currentCrop].whyEn : crops[currentCrop].whyKn"></span>
                    </p>
                </div>
            </div>

            <!-- 4. DISCLAIMER FOOTER CARD -->
            <div class="rounded-xl p-2 sm:p-3 bg-stone-50 border border-stone-200 text-stone-500 flex items-start gap-1.5 sm:gap-2 text-[10px] sm:text-[11px]">
                <span class="text-xs sm:text-sm shrink-0">📊</span>
                <p class="leading-tight" :class="lang === 'kn' ? 'kn-text' : ''">
                    <strong class="font-bold text-stone-700" x-text="lang === 'en' ? 'Disclaimer: ' : 'ಹಕ್ಕುತ್ಯಾಗ: '"></strong>
                    <span x-text="lang === 'en' 
                        ? 'Statistical projections based on historical APMC auction patterns. Subject to market fluctuations, weather, and policy shifts.' 
                        : 'ಐತಿಹಾಸಿಕ ಎಪಿಎಂಸಿ ಹರಾಜು ಮಾದರಿಗಳ ಆಧಾರದ ಮೇಲೆ ಅಂಕಿಅಂಶ ಮುನ್ಸೂಚನೆ. ಮಾರುಕಟ್ಟೆ ಏರಿಳಿತಗಳು, ಹವಾಮಾನ ಮತ್ತು ನೀತಿ ಬದಲಾವಣೆಗಳಿಗೆ ಒಳಪಟ್ಟಿರುತ್ತದೆ.'"></span>
                </p>
            </div>

        </div>
